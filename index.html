<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX Checklist</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FX Checklist">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e3e7ef;--accent:#315efb;--good:#168a5b;--bad:#d14343;--shadow:0 10px 30px rgba(20,30,55,.08);--secondary-bg:#edf1f7;--secondary-text:#33405a;--input-border:#ccd3df;--hover-bg:#f1f3f7;--modal-shadow:0 20px 60px rgba(0,0,0,.2);--overlay:rgba(10,18,35,.48)}
[data-theme="dark"]{--bg:#000000;--card:#151515;--text:#f2f2f2;--muted:#8a8a8a;--line:#262626;--accent:#ff8a3d;--good:#2fbf80;--bad:#ef5a5a;--shadow:0 10px 30px rgba(0,0,0,.6);--secondary-bg:#1f1f1f;--secondary-text:#d4d4d4;--input-border:#333333;--hover-bg:#242424;--modal-shadow:0 20px 60px rgba(0,0,0,.8);--overlay:rgba(0,0,0,.75)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;transition:background .2s,color .2s}
.app{max-width:820px;margin:0 auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.title{font-size:24px;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:4px}
button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.secondary{background:var(--secondary-bg);color:var(--secondary-text)}.primary{background:var(--accent);color:#fff}
.score-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px;position:sticky;top:12px;z-index:15}.score-row{display:flex;align-items:end;justify-content:space-between;gap:15px}.score{font-size:40px;font-weight:850;line-height:1}.score small{font-size:18px;color:var(--muted);font-weight:600}.status{font-weight:800;font-size:16px}.good{color:var(--good)}.bad{color:var(--bad)}
.bar{height:10px;background:var(--secondary-bg);border-radius:99px;overflow:hidden;margin-top:18px}.bar>div{height:100%;background:var(--accent);border-radius:99px;transition:.2s;width:0}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:14px}.meta strong{color:var(--text)}
.section{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.section-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.section-head h2{font-size:16px;margin:0}.items{padding:8px 14px}.item{display:flex;align-items:center;gap:13px;padding:15px 6px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.check{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}.label{flex:1;min-width:0}.label-text{font-size:15px;line-height:1.45}.points{font-weight:800;font-size:14px;white-space:nowrap}.empty{padding:35px 20px;text-align:center;color:var(--muted)}
.heading{padding:16px 6px 8px;font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.02em}.heading:first-child{padding-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px;border-top:1px solid var(--line)}.actions button{display:flex;align-items:center;gap:8px;transition:background .2s}
#copyBtn.copied{background:var(--good)}
#copyBtn{width:150px;justify-content:center;flex:0 0 auto}
.menu-wrap{position:relative}.menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:170px;padding:6px;display:none;z-index:20}.menu.open{display:block}.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--text)}.menu button:hover{background:var(--hover-bg)}.menu-icon{width:18px;height:18px;flex:0 0 auto;color:currentColor}
.modal-bg{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal-bg.open{display:flex}.modal{background:var(--card);width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:20px;box-shadow:var(--modal-shadow);color:var(--text)}.modal h2{margin:0 0 16px;font-size:19px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input[type=text],.field input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--input-border);border-radius:10px;outline:none;background:var(--card);color:var(--text)}.edit-row{display:flex;gap:8px;align-items:center;margin-bottom:9px;background:var(--card)}.edit-row input[type=text]{flex:1}.edit-row input[type=number]{width:82px}.icon{background:var(--secondary-bg);color:var(--secondary-text);padding:9px 11px}.drag-handle{cursor:grab;color:var(--muted);font-size:16px;padding:9px 4px;flex:0 0 auto;touch-action:none;user-select:none}.edit-row.dragging{opacity:.4}.edit-row.drag-over-top{border-top:2px solid var(--accent)}.edit-row.drag-over-bottom{border-bottom:2px solid var(--accent)}.edit-row.heading-row{background:var(--secondary-bg);border-radius:10px;padding:4px 6px}.edit-row.heading-row .etext{font-weight:800}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hint{font-size:12px;color:var(--muted);margin-top:5px}
@media(max-width:560px){.app{padding:18px 12px 35px}.top{align-items:flex-start}.top button{padding:8px 10px}.score{font-size:34px}.item{gap:10px}.label-text{font-size:14px}}
.tabbar{display:flex;align-items:center;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.tabbar::-webkit-scrollbar{height:4px}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:99px;background:var(--secondary-bg);color:var(--secondary-text);font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;border:1px solid transparent}
.tab.active{background:var(--accent);color:#fff}
.tab-add{flex:0 0 auto;width:36px;height:36px;border-radius:99px;background:var(--secondary-bg);color:var(--secondary-text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.list-name-input{width:100%;padding:11px 12px;border:1px solid var(--input-border);border-radius:10px;outline:none;background:var(--card);color:var(--text);margin-bottom:6px}
.delete-list-btn{background:none;color:var(--bad);padding:8px 0;font-size:13px;text-decoration:underline}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="title">FX Checklist</div><div class="sub">条件が揃っているかを点数で確認</div></div>
    <div class="menu-wrap">
      <button class="secondary" onclick="toggleMenu()" style="display:flex;align-items:center;gap:8px"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>設定</button>
      <div id="settingsMenu" class="menu">
        <button onclick="openSettings()"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L15.5 5 19 8.5 8.5 19 4 20z"/><path d="M13 7l4 4"/></svg>項目を編集</button>
        <button onclick="downloadData()"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8 8l4-4 4 4"/><rect x="5" y="15" width="14" height="5" rx="2"/></svg>保存</button>
        <button onclick="triggerImport()"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><rect x="5" y="15" width="14" height="5" rx="2"/></svg>インポート</button>
        <button onclick="toggleTheme()"><svg id="themeIcon" class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span id="themeLabel">ダークモード</span></button>
      </div>
    </div>
    <input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)">
  </div>

  <div id="tabbar" class="tabbar"></div>

  <div class="score-card">
    <div class="score-row">
      <div><div class="score"><span id="score">0</span><small> / <span id="max">0</span>点</small></div></div>
      <div id="status" class="status bad">条件不足</div>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="meta"><span>合格ライン <strong id="threshold">0</strong>点</span><span>残り <strong id="remaining">0</strong>点</span></div>
  </div>

  <div class="section">
    <div class="section-head"><h2>エントリー条件</h2><span id="count" class="sub"></span></div>
    <div id="items" class="items"></div>
    <div class="actions">
      <button class="secondary" onclick="clearChecks()"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>リセット</button>
      <button id="copyBtn" class="primary" onclick="copyResult()"><svg id="copyIcon" class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span id="copyLabel">結果をコピー</span></button>
    </div>
  </div>
</div>

<div id="modalBg" class="modal-bg">
  <div class="modal">
    <h2>チェック項目を編集</h2>
    <div class="field"><label>リスト名</label><input id="listNameInput" type="text" class="list-name-input"></div>
    <div class="field"><label>合格ライン</label><input id="thresholdInput" type="number" min="0" step="1"><div class="hint">この点数以上で「条件を満たしています」と判定します。</div></div>
    <div class="field"><label>項目</label><div id="editItems"></div><div style="display:flex;gap:8px"><button class="secondary" onclick="addEditItem()">＋ 項目を追加</button><button class="secondary" onclick="addEditHeading()">＋ ジャンルを追加</button></div></div>
    <button id="deleteListBtn" class="delete-list-btn" onclick="deleteCurrentList()">このリストを削除</button>
    <div class="modal-actions"><button class="secondary" onclick="closeSettings()">キャンセル</button><button class="primary" onclick="saveSettings()">保存</button></div>
  </div>
</div>

<script>
const KEY="fxChecklistStore_v2";
const OLD_KEY="fxEntryChecklist_v1";
const THEME_KEY="fxChecklistTheme_v1";
function defaultItems(){return[{text:"上位足の方向と一致している",points:2,checked:false},{text:"重要なサポート・レジスタンスが確認できる",points:2,checked:false},{text:"経済指標の影響がない",points:1,checked:false},{text:"トレンドが発生している",points:1,checked:false},{text:"エントリー根拠が明確",points:2,checked:false},{text:"損切り位置が適切",points:2,checked:false}]}
function makeId(){return "l"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){
 try{
  const s=JSON.parse(localStorage.getItem(KEY));
  if(s&&Array.isArray(s.lists)&&s.lists.length)return s
 }catch(e){}
 // 旧バージョンのデータがあれば1つ目のリストとして移行
 try{
  const old=JSON.parse(localStorage.getItem(OLD_KEY));
  if(old&&Array.isArray(old.items)){
   const id=makeId();
   return{lists:[{id,name:"デフォルト",threshold:old.threshold||0,items:old.items}],activeId:id}
  }
 }catch(e){}
 const id=makeId();
 return{lists:[{id,name:"デフォルト",threshold:7,items:defaultItems()}],activeId:id}
}
let store=load();
function save(){localStorage.setItem(KEY,JSON.stringify(store))}
function activeList(){return store.lists.find(l=>l.id===store.activeId)||store.lists[0]}
let data=activeList();
const moonIcon='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const sunIcon='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
function applyTheme(theme){
 document.documentElement.setAttribute("data-theme",theme);
 document.getElementById("themeIcon").innerHTML=theme==="dark"?sunIcon:moonIcon;
 document.getElementById("themeLabel").textContent=theme==="dark"?"ライトモード":"ダークモード";
}
function toggleTheme(){
 const current=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
 const next=current==="dark"?"light":"dark";
 localStorage.setItem(THEME_KEY,next);
 applyTheme(next);
 closeMenu()
}
applyTheme(localStorage.getItem(THEME_KEY)==="dark"?"dark":"light");
function render(){
 renderTabs();
 const box=document.getElementById("items");box.innerHTML="";
 data.items.forEach((it,i)=>{
  if(it.type==="heading"){
   const h=document.createElement("div");h.className="heading";h.textContent=it.text;box.appendChild(h);return
  }
  const row=document.createElement("label");row.className="item";row.innerHTML=`<input class="check" type="checkbox" ${it.checked?"checked":""} onchange="toggle(${i})"><div class="label"><div class="label-text"></div></div><div class="points">＋${it.points}点</div>`;row.querySelector(".label-text").textContent=it.text;box.appendChild(row)
 });
 const realItems=data.items.filter(x=>x.type!=="heading");
 document.getElementById("count").textContent=realItems.length+"項目";
 const score=realItems.reduce((s,x)=>s+(x.checked?Number(x.points):0),0),max=realItems.reduce((s,x)=>s+Number(x.points),0),threshold=Math.max(0,Number(data.threshold)||0);
 document.getElementById("score").textContent=score;document.getElementById("max").textContent=max;document.getElementById("threshold").textContent=threshold;document.getElementById("remaining").textContent=Math.max(0,threshold-score);
 const ok=score>=threshold;const st=document.getElementById("status");st.textContent=ok?"条件を満たしています":"条件不足";st.className="status "+(ok?"good":"bad");const barEl=document.getElementById("bar");barEl.style.width=(max?Math.min(100,score/max*100):0)+"%";barEl.style.background=ok?"var(--good)":"var(--bad)";
}
function toggle(i){data.items[i].checked=!data.items[i].checked;save();render()}
function renderTabs(){
 const bar=document.getElementById("tabbar");bar.innerHTML="";
 store.lists.forEach(l=>{
  const tab=document.createElement("div");
  tab.className="tab"+(l.id===store.activeId?" active":"");
  tab.textContent=l.name||"無題";
  tab.onclick=()=>switchList(l.id);
  bar.appendChild(tab)
 });
 const addBtn=document.createElement("button");
 addBtn.className="tab-add";addBtn.type="button";addBtn.title="リストを追加";
 addBtn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';
 addBtn.onclick=addList;
 bar.appendChild(addBtn)
}
function switchList(id){
 if(id===store.activeId)return;
 store.activeId=id;save();data=activeList();render()
}
function addList(){
 const id=makeId();
 const n=store.lists.length+1;
 store.lists.push({id,name:"新しいリスト"+(n>1?n:""),threshold:7,items:defaultItems()});
 store.activeId=id;save();data=activeList();render();
 openSettings()
}
function deleteCurrentList(){
 if(store.lists.length<=1){alert("最後の1つのリストは削除できません。");return}
 if(!confirm(`「${data.name}」を削除しますか？この操作は取り消せません。`))return;
 const idx=store.lists.findIndex(l=>l.id===store.activeId);
 store.lists.splice(idx,1);
 store.activeId=store.lists[Math.max(0,idx-1)].id;
 save();data=activeList();closeSettings();render()
}
function clearChecks(){data.items.forEach(x=>x.checked=false);save();render()}
function copyResult(){
 const realItems=data.items.filter(x=>x.type!=="heading");
 const score=realItems.reduce((s,x)=>s+(x.checked?Number(x.points):0),0);
 const max=realItems.reduce((s,x)=>s+Number(x.points),0);
 const lines=[`${score}/${max}点`];
 let currentHeading=null,bucket=[];
 const flush=()=>{
  if(bucket.length){
   lines.push((currentHeading!==null?currentHeading+"―":"")+bucket.join("、"));
  }
  bucket=[]
 };
 data.items.forEach(it=>{
  if(it.type==="heading"){
   flush();currentHeading=it.text;return
  }
  if(it.checked)bucket.push(it.text)
 });
 flush();
 const text=lines.join("\n");
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).then(showCopyFeedback).catch(()=>{fallbackCopy(text);showCopyFeedback()})
 }else{
  fallbackCopy(text);showCopyFeedback()
 }
}
let copyFeedbackTimer=null;
function showCopyFeedback(){
 const icon=document.getElementById("copyIcon"),label=document.getElementById("copyLabel"),btn=document.getElementById("copyBtn");
 if(copyFeedbackTimer)clearTimeout(copyFeedbackTimer);
 icon.innerHTML='<path d="M20 6L9 17l-5-5"/>';
 label.textContent="コピー完了";
 btn.classList.add("copied");
 copyFeedbackTimer=setTimeout(()=>{
  icon.innerHTML='<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>';
  label.textContent="結果をコピー";
  btn.classList.remove("copied")
 },1500)
}
function fallbackCopy(text){
 const ta=document.createElement("textarea");
 ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
 document.body.appendChild(ta);ta.select();
 try{document.execCommand("copy")}catch(e){}
 ta.remove()
}
function openSettings(){
 closeMenu();
 document.getElementById("listNameInput").value=data.name||"";
 document.getElementById("thresholdInput").value=data.threshold;const wrap=document.getElementById("editItems");wrap.innerHTML="";
 data.items.forEach((it)=>{if(it.type==="heading")addEditHeading(it);else addEditItem(it)});
 document.getElementById("modalBg").classList.add("open")
}
function attachDrag(row,wrap){
 row.draggable=true;
 row.addEventListener("dragstart",e=>{dragRow=row;row.classList.add("dragging");e.dataTransfer.effectAllowed="move"});
 row.addEventListener("dragend",()=>{row.classList.remove("dragging");clearDragOver()});
 row.addEventListener("dragover",e=>{
  e.preventDefault();if(!dragRow||dragRow===row)return;
  clearDragOver();
  const before=e.clientY<row.getBoundingClientRect().top+row.offsetHeight/2;
  row.classList.add(before?"drag-over-top":"drag-over-bottom")
 });
 row.addEventListener("drop",e=>{
  e.preventDefault();if(!dragRow||dragRow===row)return;
  const before=e.clientY<row.getBoundingClientRect().top+row.offsetHeight/2;
  wrap.insertBefore(dragRow,before?row:row.nextSibling);
  clearDragOver();dragRow=null
 });
}
function addEditItem(it={text:"新しい条件",points:1,checked:false}){
 const wrap=document.getElementById("editItems"),row=document.createElement("div");row.className="edit-row";row.dataset.kind="item";
 row.innerHTML=`<span class="drag-handle">⠿</span><input class="etext" type="text"><input class="epoints" type="number" min="1" max="2" step="1"><button class="icon" type="button">削除</button>`;
 row.querySelector(".etext").value=it.text;row.querySelector(".epoints").value=it.points;
 row.querySelector("button").onclick=()=>row.remove();
 attachDrag(row,wrap);wrap.appendChild(row)
}
function addEditHeading(it={text:"新しいジャンル"}){
 const wrap=document.getElementById("editItems"),row=document.createElement("div");row.className="edit-row heading-row";row.dataset.kind="heading";
 row.innerHTML=`<span class="drag-handle">⠿</span><input class="etext" type="text" placeholder="ジャンル名"><button class="icon" type="button">削除</button>`;
 row.querySelector(".etext").value=it.text;
 row.querySelector("button").onclick=()=>row.remove();
 attachDrag(row,wrap);wrap.appendChild(row)
}
let dragRow=null;
function clearDragOver(){document.querySelectorAll(".edit-row").forEach(r=>r.classList.remove("drag-over-top","drag-over-bottom"))}
function saveSettings(){
 const rows=[...document.querySelectorAll(".edit-row")],items=[];
 rows.forEach((r)=>{
  const text=r.querySelector(".etext").value.trim();if(!text)return;
  if(r.dataset.kind==="heading"){items.push({type:"heading",text});return}
  const points=Math.min(2,Math.max(1,Number(r.querySelector(".epoints").value)||1));
  items.push({text,points,checked:false})
 });
 const old=data.items.filter(x=>x.type!=="heading");
 items.forEach(x=>{if(x.type==="heading")return;const same=old.find(o=>o.text===x.text);if(same)x.checked=same.checked});
 data.name=document.getElementById("listNameInput").value.trim()||"無題";
 data.threshold=Math.max(0,Number(document.getElementById("thresholdInput").value)||0);
 data.items=items;
 save();closeSettings();render()
}
function closeSettings(){document.getElementById("modalBg").classList.remove("open")}
document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeSettings()});
function toggleMenu(){document.getElementById("settingsMenu").classList.toggle("open")}
function closeMenu(){document.getElementById("settingsMenu").classList.remove("open")}
document.addEventListener("click",e=>{
 const wrap=document.querySelector(".menu-wrap");
 if(wrap&&!wrap.contains(e.target))closeMenu()
});
function downloadData(){
 closeMenu();
 const blob=new Blob([JSON.stringify(store,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 const ts=new Date().toISOString().slice(0,10);
 a.href=url;a.download=`fx-checklist-${ts}.json`;
 document.body.appendChild(a);a.click();a.remove();
 URL.revokeObjectURL(url)
}
function triggerImport(){closeMenu();document.getElementById("importFile").click()}
function importData(event){
 const file=event.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const parsed=JSON.parse(reader.result);
   if(parsed&&Array.isArray(parsed.lists)&&parsed.lists.length){
    store=parsed;
    if(!store.activeId||!store.lists.find(l=>l.id===store.activeId))store.activeId=store.lists[0].id;
   }else if(parsed&&Array.isArray(parsed.items)){
    // 旧形式（単一リスト）のインポートは新しいリストとして追加
    const id=makeId();
    store.lists.push({id,name:"インポート",threshold:parsed.threshold||0,items:parsed.items});
    store.activeId=id;
   }else{
    throw new Error("invalid")
   }
   data=activeList();save();render()
  }catch(e){
   alert("読み込みに失敗しました。正しいファイルか確認してください。")
  }
  event.target.value=""
 };
 reader.readAsText(file)
}
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}))}
</script>
